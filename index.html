<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدخال المصاريف</title>
    <style>
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 { text-align: center; margin-bottom: 25px; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
        }
        input:focus, textarea:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 8px rgba(0,210,255,0.3);
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        .message { margin-top: 15px; text-align: center; font-weight: 600; }
        .success { color: #00c853; }
        .error { color: #d50000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 إدخال مصاريف</h1>
        <form id="expenseForm">
            <div class="form-group">
                <label>التاريخ</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label>البند</label>
                <input type="text" id="item" placeholder="مثال: طلبات، نون، كيتا" required>
            </div>
            <div class="form-group">
                <label>المبلغ</label>
                <input type="number" id="amount" step="0.01" placeholder="0.00" required>
            </div>
            <div class="form-group">
                <label>ملاحظات (اختياري)</label>
                <textarea id="notes" rows="2"></textarea>
            </div>
            <button type="submit">حفظ في Google Sheets</button>
            <div class="message" id="message"></div>
        </form>
    </div>

    <script>
        // 👇 ضع رابط Web App URL هنا
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxF0xJsIbZ3AYKmGk9vh8K8Fgn9Vtvg1_2sj2K9kFi0k0LkIC4vvNqTAsZhEdGjobb_/exec';

        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('message');
            msg.textContent = 'جاري الحفظ...';
            msg.className = 'message';

            const data = {
                date: document.getElementById('date').value,
                item: document.getElementById('item').value,
                amount: document.getElementById('amount').value,
                notes: document.getElementById('notes').value
            };

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(data),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await res.json();
                if (result.status === 'success') {
                    msg.textContent = '✅ تم الحفظ بنجاح!';
                    msg.className = 'message success';
                    document.getElementById('expenseForm').reset();
                } else {
                    msg.textContent = '❌ خطأ: ' + result.message;
                    msg.className = 'message error';
                }
            } catch (err) {
                msg.textContent = '❌ فشل الاتصال، تأكد من الرابط والصلاحيات.';
                msg.className = 'message error';
                console.error(err);
            }
        });
    </script>
</body>
</html>
