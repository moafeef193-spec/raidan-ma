<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | لوحة التحكم</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* طبقة تعتيم فوق الخلفية */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
        }

        .login-container {
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            color: #fff;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container h1 {
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-group input:focus {
            border-color: #00d2ff;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 20px;
            font-size: 14px;
            min-height: 20px;
        }

        .message.success { color: #00e676; }
        .message.error { color: #ff5252; }

        .loading {
            display: none;
            margin: 10px auto;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #00d2ff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>تسجيل الدخول</h1>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" name="username" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required>
            </div>
            <div class="loading" id="loading"></div>
            <button type="submit" class="btn-login">دخول</button>
            <div class="message" id="message"></div>
        </form>
    </div>

    <script>
        // ==========================================
        // كود JavaScript لربط الواجهة بـ Google Sheets
        // ==========================================

        // 👇 ضع رابط Web App URL الذي نسخته من Google Apps Script هنا
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz94dlvbYEGP51SGnfhHA1-_xAmB2V6jIC-My_rND12X26LGqqscDJ1b_wA1PqhA4mB/exec';

        const loginForm = document.getElementById('loginForm');
        const messageDiv = document.getElementById('message');
        const loadingDiv = document.getElementById('loading');
        const submitBtn = document.querySelector('.btn-login');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // منع إعادة تحميل الصفحة

            // إظهار مؤشر التحميل وتعطيل الزر
            loadingDiv.style.display = 'block';
            submitBtn.disabled = true;
            messageDiv.textContent = '';
            messageDiv.className = 'message';

            // جمع بيانات النموذج
            const formData = new FormData(loginForm);
            const data = Object.fromEntries(formData.entries());

            try {
                // إرسال البيانات إلى Google Apps Script
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(data),
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (result.status === 'success') {
                    messageDiv.textContent = 'تم تسجيل الدخول بنجاح!';
                    messageDiv.className = 'message success';
                    loginForm.reset(); // تفريغ الحقول
                    // يمكنك هنا توجيه المستخدم إلى صفحة أخرى
                    // window.location.href = 'dashboard.html';
                } else {
                    messageDiv.textContent = 'حدث خطأ: ' + result.message;
                    messageDiv.className = 'message error';
                }

            } catch (error) {
                messageDiv.textContent = 'فشل الاتصال بالخادم. تحقق من اتصالك بالإنترنت.';
                messageDiv.className = 'message error';
                console.error('Error:', error);
            } finally {
                // إخفاء مؤشر التحميل وإعادة تمكين الزر
                loadingDiv.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
